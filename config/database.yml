default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "db") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "flashforge_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "flashforge_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_PRODUCTION_NAME", "flashforge_production") %>
